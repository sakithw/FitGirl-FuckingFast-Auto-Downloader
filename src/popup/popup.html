<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitGirl-FuckingFast Auto Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img class="brand-mark" src="../../assets/icons/icon-128.png" width="40" height="40" alt="">
        <div><h1>FitGirl-FuckingFast</h1><p>Auto Downloader</p></div>
      </header>
      <section id="automation-card" class="automation-card is-loading" aria-labelledby="automation-title" aria-live="polite">
        <svg id="automation-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path id="status-check" d="m5 12 4 4 10-10" hidden></path>
          <path id="status-pause" d="M8 5v14M16 5v14"></path>
        </svg>
        <div id="automation-details">
          <h2 id="automation-title">Loading automation</h2>
          <p id="automation-description">Reading your saved setting.</p>
        </div>
      </section>
      <button id="automation-action" class="action-button" type="button" disabled>
        <svg id="action-power" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 5.7a9 9 0 1 0 11.4 0"></path></svg>
        <span id="action-label">Loading…</span>
      </button>
      <div class="site-row"><span>Supported site</span><strong>FuckingFast <span class="site-check" aria-hidden="true">✓</span></strong></div>
      <p id="page-status" class="page-status" role="status" hidden></p>
      <p id="activity-state" class="activity" role="status" hidden></p>
      <p class="fallback" id="fallback" hidden>Manual action required. Use the verified download control if needed.</p>
      <p class="error" id="error" role="alert" hidden></p>
      <footer class="footer"><p id="page-instruction">Open a file link to begin</p><span id="version"></span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
